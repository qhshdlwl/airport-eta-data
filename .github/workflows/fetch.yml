# 30분마다 공항 데이터를 갱신한다.
# 정본은 앱 레포의 apps/airport-eta/ops/fetch.yml — 고치면 양쪽을 같이 고친다.
# 필요한 시크릿: DATA_GO_KR_KEY (공공데이터포털 일반 인증키 Decoding)
name: fetch
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency: airport-eta-fetch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배치
        run: node scripts/fetch-airport.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 올리기
        run: |
          git config user.name "airport-eta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || { git commit -q -m "data: $(TZ=Asia/Seoul date '+%F %H:%M') 갱신" && git push -q; }
